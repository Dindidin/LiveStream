
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Dindins Space Archive</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(ellipse at 50% 0%, #142747 0%, transparent 55%),
        #050914;
      color: #dce8ff;
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 35px 18px;
      overflow-x: hidden;
    }

    /* Stars */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: 0.45;
      background-image:
        radial-gradient(1px 1px at 10% 20%, white 99%, transparent),
        radial-gradient(1px 1px at 80% 15%, #91baff 99%, transparent),
        radial-gradient(2px 2px at 70% 70%, white 99%, transparent),
        radial-gradient(1px 1px at 20% 85%, #91baff 99%, transparent),
        radial-gradient(1px 1px at 90% 55%, white 99%, transparent);
      background-size: 190px 190px;
    }

    .container {
      position: relative;
      width: 100%;
      max-width: 760px;
    }

    header {
      margin-bottom: 25px;
    }

    h1 {
      margin: 0;
      font-size: clamp(27px, 5vw, 42px);
      font-weight: 500;
      letter-spacing: -1.5px;
    }

    .description {
      margin-top: 10px;
      color: #8497b9;
      font-size: 13px;
      letter-spacing: 0.3px;
    }

    /* Stream screen */
    .screen {
      position: relative;
      aspect-ratio: 16 / 9;
      width: 100%;
      background:
        radial-gradient(ellipse at center, #101f38 0%, #070d19 70%);
      border: 1px solid #273b5b;
      outline: 1px solid #101d32;
      outline-offset: 5px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .screen::before,
    .screen::after {
      content: "";
      position: absolute;
      width: 90px;
      height: 90px;
      border: 1px solid #253b5a;
      transform: rotate(45deg);
      opacity: 0.5;
    }

    .screen::before {
      top: -65px;
      left: -65px;
    }

    .screen::after {
      bottom: -65px;
      right: -65px;
    }

    .screen-content {
      position: relative;
      text-align: center;
      z-index: 1;
    }

    .play {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 15px 24px;
      background: #dce8ff;
      color: #071020;
      font-size: 12px;
      font-weight: bold;
      letter-spacing: 2px;
      text-decoration: none;
      transition: 0.2s;
    }

    .play:hover {
      background: white;
      box-shadow: 0 0 25px #507fbd55;
      transform: translateY(-2px);
    }

    .play-icon {
      font-size: 15px;
    }

    .screen-caption {
      margin-top: 17px;
      color: #60799f;
      font-size: 10px;
      letter-spacing: 3px;
    }

    footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 22px;
      color: #526582;
      font-size: 11px;
    }

    footer a {
      color: #8daee8;
      text-decoration: none;
    }

    footer a:hover {
      color: white;
    }

    @media (max-width: 480px) {
      .screen {
        aspect-ratio: 4 / 3;
      }

      .play {
        padding: 13px 17px;
      }
    }
  </style>
</head>

<body>
  <main class="container">

    <header>
      <h1>Dindins Space Archive</h1>
      <div class="description">
        mostly streaming sewh or gnb in roblox
      </div>
    </header>

    <div class="screen">
      <div class="screen-content">
        <a
          class="play"
          href="https://demo.piik.tv/r/8381"
          target="_blank"
          rel="noopener noreferrer"
        >
          <span class="play-icon">▶</span>
          Press play to watch LiveStream :D
        </a>

        <div class="screen-caption">LIVE SCREEN</div>
      </div>
    </div>

    <footer>
      <span>✦ DINDIN'S SPACE ARCHIVE</span>

      <a href="https://x.com/" target="_blank" rel="noopener noreferrer">
        tw ↗
      </a>
    </footer>

  </main>
</body>
</html>
